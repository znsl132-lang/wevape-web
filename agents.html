<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>We Vape · AI 비서 상황판</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14; --panel:#121820; --line:#1f2a36; --txt:#e6edf3; --dim:#8b98a8; --mute:#5b6775;
  --ok:#3ddc97; --warn:#f5c451; --err:#ff6b6b; --acc:#6ea8fe; --glow:#6ea8fe;
  --n-research:#7cc7ff; --n-edit:#c39cff; --n-review:#ffb35c; --n-queue:#f5c451; --n-publish:#3ddc97; --n-learn:#ff8ad8; --n-watch:#9aa8b8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:14px}
a{color:var(--acc)}
.top{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0f151c,#0b0f14)}
.top h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.2px}
.top .sub{color:var(--dim);font-size:12px}
.top .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.err{background:var(--err)}
.dot.warn{background:var(--warn)}
.wrap{display:grid;grid-template-columns:1fr 380px;gap:16px;padding:16px 20px;min-height:calc(100vh - 62px)}
@media(max-width:980px){.wrap{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{font-size:11px;color:var(--dim);letter-spacing:.3px}
.stat .v{font-size:22px;font-weight:600;margin-top:4px;font-family:"IBM Plex Mono",monospace}
.stat .v small{font-size:12px;color:var(--dim);font-weight:400;margin-left:4px}
.board{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;overflow:hidden}
.board h2{font-size:13px;color:var(--dim);font-weight:500;margin:0 0 14px}
svg{width:100%;height:auto;display:block}
.node rect{fill:#0e141b;stroke:var(--line);stroke-width:1.2;rx:14}
.node text{fill:var(--txt);font-family:"IBM Plex Sans KR",sans-serif}
.node .name{font-size:14px;font-weight:600}
.node .role{font-size:11px;fill:var(--dim)}
.node .last{font-size:11px;fill:var(--dim);font-family:"IBM Plex Mono",monospace}
.node .msg{font-size:10.5px;fill:#b9c4d0}
.node .ring{fill:none;stroke-width:2;opacity:.0}
.node.live .ring{opacity:1;animation:ring 1.6s ease-out infinite}
.node.live rect{stroke-width:1.6}
.node.recent rect{stroke-opacity:.9}
.node.idle rect{stroke:var(--line)}
.node .core{r:6}
.node.live .core{animation:pulse 1.2s ease-in-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.edge{stroke:var(--line);stroke-width:2;fill:none}
.edge.flow{stroke:var(--acc);stroke-dasharray:6 8;animation:dash 1s linear infinite;opacity:.9}
@keyframes dash{to{stroke-dashoffset:-14}}
.feed{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 94px)}
.feed h2{font-size:13px;color:var(--dim);font-weight:500;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.feed .list{overflow:auto;padding:8px 0}
.row{display:grid;grid-template-columns:56px 14px 1fr;gap:8px;padding:8px 16px;border-bottom:1px solid #131b24;font-size:12.5px;animation:fade .5s ease}
.row.new{background:#0f1a26}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.row .t{color:var(--mute);font-family:"IBM Plex Mono",monospace;font-size:11px;padding-top:2px}
.row .sw{width:10px;height:10px;border-radius:3px;margin-top:4px}
.row .b b{font-weight:600}
.row .b .tg{color:var(--dim)}
.row .b .m{color:#b9c4d0;display:block;margin-top:2px;word-break:break-all}
.empty{color:var(--mute);padding:30px;text-align:center}
.gate{position:fixed;inset:0;background:rgba(6,9,13,.92);display:flex;align-items:center;justify-content:center;z-index:9}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(440px,92vw)}
.card h3{margin:0 0 6px;font-size:16px}
.card p{margin:0 0 16px;color:var(--dim);font-size:12.5px}
.card label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
.card input[type=text],.card input[type=password]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0b1016;color:var(--txt);font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.card .btn{margin-top:16px;width:100%;padding:11px;border-radius:10px;border:0;background:var(--acc);color:#04101f;font-weight:600;font-size:14px;cursor:pointer}
.card .err{color:var(--err);font-size:12px;margin-top:8px;min-height:16px}
.card .rem{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--dim)}
.foot{color:var(--mute);font-size:11px;padding:10px 20px;border-top:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
</style>
</head>
<body>

<div class="top">
  <h1>AI 비서 상황판</h1>
  <span class="sub">We Vape SNS · 로그 시트 기준 실제 활동만 표시</span>
  <div class="right">
    <span class="pill"><span class="dot" id="conn"></span><span id="conntxt">연결 안 됨</span></span>
    <span id="clock">--:--:--</span>
  </div>
</div>

<div class="wrap">
  <div>
    <div class="stats">
      <div class="stat"><div class="k">승인 대기</div><div class="v" id="s-review">-</div></div>
      <div class="stat"><div class="k">오늘 발행</div><div class="v" id="s-sent">-</div></div>
      <div class="stat"><div class="k">큐 잔여</div><div class="v" id="s-queue">-</div></div>
      <div class="stat"><div class="k">보유 소재</div><div class="v" id="s-topics">-</div></div>
      <div class="stat"><div class="k">리서치 소재</div><div class="v" id="s-trend">-</div></div>
      <div class="stat"><div class="k">자동 발행</div><div class="v" id="s-auto">-</div></div>
    </div>

    <div class="board">
      <h2>파이프라인 — 최근 90초 안에 움직인 비서는 빛나고, 10분 안에 움직였으면 테두리가 살아 있습니다</h2>
      <svg id="svg" viewBox="0 0 1080 420" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="feed">
    <h2><span class="dot ok" id="feeddot"></span>활동 로그 <span style="margin-left:auto;font-weight:400" id="feedn"></span></h2>
    <div class="list" id="list"><div class="empty">연결하면 로그가 여기에 흐릅니다</div></div>
  </div>
</div>

<div class="foot">8초마다 새로고침 · 시트 「로그」의 최근 80건 · 가짜 애니메이션 없음: 로그가 없으면 아무것도 움직이지 않습니다</div>

<div class="gate" id="gate">
  <div class="card">
    <h3>연결</h3>
    <p>발행 콘솔과 같은 웹앱 주소와 접속 코드를 씁니다.</p>
    <label>웹앱 주소</label>
    <input type="text" id="g-url" value="https://script.google.com/macros/s/AKfycby79BDH9Z6HXAPLS9t4_Te4kqIucJicsMtmNzx_9MGx0D4NgRMBXxT4MbuN109IC9hE/exec">
    <label>접속 코드</label>
    <input type="password" id="g-code" placeholder="접속 코드">
    <div class="rem"><input type="checkbox" id="g-rem"><label for="g-rem" style="margin:0">이 기기에 기억 (내 컴퓨터에서만)</label></div>
    <button class="btn" onclick="connect()">상황판 열기</button>
    <div class="err" id="g-err"></div>
  </div>
</div>

<script>
/* ===== 비서 정의: 어떤 로그 종류가 어느 비서의 활동인가 ===== */
var AGENTS = [
  { id:'research', name:'리서치 비서', role:'검색·소재 발굴', color:'var(--n-research)', x:30,  y:150, kinds:['리서치','소재'] },
  { id:'edit',     name:'편집 비서',   role:'채널별 문안 작성', color:'var(--n-edit)',     x:238, y:150, kinds:['AI생성','AI미리보기','AI미리보기실패','생성','자동생성','Gemini','재시도','드라이런'] },
  { id:'review',   name:'규제 심사',   role:'금지어·규제 차단', color:'var(--n-review)',   x:446, y:150, kinds:['AI차단','차단','인입거절','거절'] },
  { id:'queue',    name:'승인 큐',     role:'사람 승인 대기',  color:'var(--n-queue)',    x:654, y:150, kinds:['인입','등록','승인','대기','큐','상한'] },
  { id:'publish',  name:'발행',        role:'인스타·쓰레드 게시', color:'var(--n-publish)', x:862, y:150, kinds:['발행','수동게시','이미지생성','업로드','파일업로드','Cloudflare저장','첫댓글실패','삭제','일괄삭제','파일삭제'] },
  { id:'learn',    name:'학습',        role:'성과 집계·반영',  color:'var(--n-learn)',    x:446, y:320, kinds:['학습'] },
  { id:'watch',    name:'감시',        role:'점검·토큰·오류',  color:'var(--n-watch)',    x:862, y:320, kinds:['점검','오류','토큰','설정','배포'] }
];
var EDGES = [['research','edit'],['edit','review'],['review','queue'],['queue','publish'],['publish','learn'],['learn','edit']];
var NW = 180, NH = 96;

var API_URL = '', CODE = '', timer = null, seen = {}, first = true;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function agentOf(kind){
  for(var i=0;i<AGENTS.length;i++) if(AGENTS[i].kinds.indexOf(kind)>=0) return AGENTS[i];
  return AGENTS[6];
}
function colorOf(a){ return getComputedStyle(document.documentElement).getPropertyValue(a.color.slice(4,-1)).trim() || '#888'; }

/* ===== 보드 그리기 ===== */
function drawBoard(){
  var s = '';
  var byId = {}; AGENTS.forEach(function(a){ byId[a.id]=a; });
  EDGES.forEach(function(e){
    var a = byId[e[0]], b = byId[e[1]];
    var x1 = a.x + NW, y1 = a.y + NH/2, x2 = b.x, y2 = b.y + NH/2;
    if(e[0]==='publish' && e[1]==='learn'){ x1 = a.x + NW/2; y1 = a.y + NH; x2 = b.x + NW; y2 = b.y + NH/2; }
    if(e[0]==='learn' && e[1]==='edit'){ x1 = a.x; y1 = a.y + NH/2; x2 = b.x + NW/2; y2 = b.y + NH; }
    var mx = (x1+x2)/2;
    s += '<path class="edge" id="e-'+e[0]+'-'+e[1]+'" d="M'+x1+' '+y1+' C '+mx+' '+y1+', '+mx+' '+y2+', '+x2+' '+y2+'"/>';
  });
  AGENTS.forEach(function(a){
    var c = colorOf(a);
    s += '<g class="node idle" id="n-'+a.id+'" transform="translate('+a.x+','+a.y+')">'
      + '<rect width="'+NW+'" height="'+NH+'" rx="14" style="stroke:'+c+'"/>'
      + '<g transform="translate(22,26)"><circle class="ring" r="9" style="stroke:'+c+'"/><circle class="core" r="6" fill="'+c+'"/></g>'
      + '<text class="name" x="40" y="31">'+a.name+'</text>'
      + '<text class="role" x="16" y="52">'+a.role+'</text>'
      + '<text class="last" x="16" y="70" id="l-'+a.id+'">아직 기록 없음</text>'
      + '<text class="msg" x="16" y="86" id="m-'+a.id+'"></text>'
      + '</g>';
  });
  $('svg').innerHTML = s;
  $('legend').innerHTML = AGENTS.map(function(a){ return '<span><i style="background:'+colorOf(a)+'"></i>'+a.name+' · '+a.kinds.slice(0,3).join('/')+(a.kinds.length>3?'…':'')+'</span>'; }).join('');
}

/* ===== 상태 반영 ===== */
function ago(iso){
  var d = (Date.now() - new Date(iso).getTime())/1000;
  if(d < 60) return Math.max(0,Math.round(d)) + '초 전';
  if(d < 3600) return Math.round(d/60) + '분 전';
  if(d < 86400) return Math.round(d/3600) + '시간 전';
  return Math.round(d/86400) + '일 전';
}
function paint(d){
  var logs = d.logs || [];
  var lastBy = {}, now = Date.now();
  logs.forEach(function(l){ var a = agentOf(l.kind); if(!lastBy[a.id]) lastBy[a.id] = l; });

  AGENTS.forEach(function(a){
    var g = $('n-'+a.id), l = lastBy[a.id];
    g.setAttribute('class','node ' + (!l ? 'idle' : (now - new Date(l.t).getTime() < 90000 ? 'live' : (now - new Date(l.t).getTime() < 600000 ? 'recent' : 'idle'))));
    $('l-'+a.id).textContent = l ? (ago(l.t) + ' · ' + l.kind) : '아직 기록 없음';
    $('m-'+a.id).textContent = l ? (l.target + (l.msg ? ' — ' + l.msg : '')).substring(0, 24) : '';
  });
  EDGES.forEach(function(e){
    var a = lastBy[e[0]], b = lastBy[e[1]];
    var flow = a && b && (now - new Date(a.t).getTime() < 600000) && (now - new Date(b.t).getTime() < 600000);
    var p = $('e-'+e[0]+'-'+e[1]); if(p) p.setAttribute('class', 'edge' + (flow ? ' flow' : ''));
  });

  var q = d.queue || {}, st = d.status || {};
  $('s-review').textContent = q['승인대기'] || 0;
  var sf = st.safety || {};
  $('s-sent').innerHTML = (sf.sentToday !== undefined ? sf.sentToday : '-') + '<small>/ ' + (sf.maxPerDay || '-') + '</small>';
  var au = st.auto || {};
  $('s-queue').innerHTML = (au.queueDays !== undefined ? au.queueDays : '-') + '<small>일</small>';
  $('s-topics').textContent = (st.topics && st.topics['전체'] !== undefined) ? st.topics['전체'] : '-';
  $('s-trend').textContent = (st.trend && st.trend['보유소재'] !== undefined) ? st.trend['보유소재'] : '-';
  $('s-auto').innerHTML = au.on === undefined ? '-' : (au.on ? '<span style="color:var(--ok)">ON</span>' : '<span style="color:var(--warn)">OFF</span>')
    + (au.tokenDaysLeft !== undefined && au.tokenDaysLeft !== null ? '<small>토큰 D-' + au.tokenDaysLeft + '</small>' : '');

  var list = $('list');
  if(!logs.length){ list.innerHTML = '<div class="empty">로그가 비어 있습니다</div>'; return; }
  list.innerHTML = logs.map(function(l){
    var a = agentOf(l.kind), k = l.t + '|' + l.kind + '|' + l.target;
    var isNew = !first && !seen[k];
    var t = new Date(l.t);
    return '<div class="row'+(isNew?' new':'')+'" title="'+esc(l.t)+'"><div class="t">'+(isNaN(t)?'':('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2))+'</div>'
      + '<div class="sw" style="background:'+colorOf(a)+'"></div>'
      + '<div class="b"><b>'+esc(l.kind)+'</b> <span class="tg">'+esc(l.target)+'</span>'+(l.msg?'<span class="m">'+esc(l.msg)+'</span>':'')+'</div></div>';
  }).join('');
  seen = {}; logs.forEach(function(l){ seen[l.t + '|' + l.kind + '|' + l.target] = 1; });
  $('feedn').textContent = logs.length + '건';
  first = false;
}

/* ===== 통신 ===== */
function api(path, body){
  var o = { path:path, code:CODE }; for(var k in (body||{})) o[k] = body[k];
  return fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(o) })
    .then(function(r){ return r.text(); })
    .then(function(t){ var j; try{ j = JSON.parse(t); }catch(e){ throw new Error('서버 응답을 읽지 못했습니다'); } if(!j.ok) throw new Error(j.error||'알 수 없는 오류'); return j; });
}
function tick(){
  api('agents', { n:80 }).then(function(j){
    $('conn').className = 'dot ok'; $('conntxt').textContent = '연결됨 · ' + new Date().toLocaleTimeString('ko-KR');
    paint(j.data || {});
  }, function(e){
    $('conn').className = 'dot err'; $('conntxt').textContent = e.message;
  });
}
function connect(){
  API_URL = $('g-url').value.trim(); CODE = $('g-code').value.trim();
  if(!API_URL || !CODE){ $('g-err').textContent = '주소와 접속 코드를 넣어주세요.'; return; }
  $('g-err').textContent = '연결하는 중…';
  api('ping').then(function(){
    if($('g-rem').checked){ try{ localStorage.setItem('wv_agents', JSON.stringify({u:API_URL,c:CODE})); }catch(e){} }
    $('gate').style.display = 'none';
    tick(); timer = setInterval(tick, 8000);
  }, function(e){ $('g-err').textContent = e.message || '연결하지 못했습니다.'; });
}
setInterval(function(){ $('clock').textContent = new Date().toLocaleTimeString('ko-KR'); }, 1000);
drawBoard();
(function(){
  try{
    var s = JSON.parse(localStorage.getItem('wv_agents') || 'null');
    if(s && s.u && s.c){ $('g-url').value = s.u; $('g-code').value = s.c; $('g-rem').checked = true; connect(); }
  }catch(e){}
})();
</script>
</body>
</html>
