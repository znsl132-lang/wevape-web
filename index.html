<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>We Vape SNS 발행 관리</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0f18;color:#e8eaf0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.6}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#12141f;border-bottom:1px solid #1e2130;flex-wrap:wrap}
.lg{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#6c5ce7,#4a8cf7);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#9aa2b8;background:#161927;padding:4px 10px;border-radius:20px;border:1px solid #222637}
.dot{width:6px;height:6px;border-radius:50%;background:#3ddc97;box-shadow:0 0 8px #3ddc97;animation:bp 2s ease-in-out infinite}
.dot.off{background:#f5a623;box-shadow:0 0 8px #f5a623}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.35}}
.wrap{display:flex;min-height:calc(100vh - 49px);flex-wrap:wrap}
.side{width:170px;flex:0 0 170px;background:#101320;border-right:1px solid #1e2130;padding:12px 8px}
@media(max-width:700px){.side{width:100%;flex:1 0 100%;border-right:none;border-bottom:1px solid #1e2130}}
.sl{font-size:10px;color:#4d5468;padding:0 8px 8px;letter-spacing:.5px}
.si{display:flex;justify-content:space-between;padding:7px 9px;border-radius:7px;color:#9aa2b8;cursor:pointer;font-size:12px}
.si:hover{background:#171a29;color:#e8eaf0}.si.on{background:#1d2135;color:#fff}
.si b{font-size:10px;color:#5d6478;font-weight:400}
.main{flex:1;padding:16px 18px;min-width:0}
.eb{font-size:10px;letter-spacing:2px;color:#5d6478;margin-bottom:5px}
h1{font-size:20px;font-weight:500;color:#fff;margin-bottom:3px}
.sub{font-size:12px;color:#727a92;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-bottom:14px}
.cd{background:#141726;border:1px solid #1e2233;border-radius:10px;padding:12px 13px}
.cd .t{font-size:11px;color:#9aa2b8}.cd .v{font-size:21px;font-weight:500;color:#fff;margin-top:4px}
.cd .v small{font-size:11px;color:#727a92;font-weight:400}
.bar{height:3px;background:#1e2233;border-radius:3px;margin-top:8px;overflow:hidden}
.fl{height:100%;border-radius:3px;transition:width 1s}
.row{border:1px solid #1e2233;border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#121523}
.rh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.dt{font-size:11px;color:#727a92}
.chip{font-size:10px;color:#9aa2b8;background:#1b1f2f;padding:2px 7px;border-radius:4px;margin-right:4px}
.bdg{font-size:10px;padding:2px 9px;border-radius:20px;font-weight:500;white-space:nowrap}
.tx{font-size:12.5px;color:#c3c9d8;margin-top:6px;white-space:pre-wrap}
.gate{max-width:340px;margin:80px auto;padding:22px;background:#141726;border:1px solid #1e2233;border-radius:12px}
input{width:100%;padding:10px;border-radius:7px;border:1px solid #262b3d;background:#0d0f18;color:#e8eaf0;font-size:14px;margin:10px 0}
button{padding:9px 15px;border-radius:7px;border:none;background:#6c5ce7;color:#fff;font-size:13px;cursor:pointer;font-family:inherit}
button.gh{background:#1b1f2f;border:1px solid #2a3048;color:#c3c9d8}
.err{color:#ff7b72;font-size:12px;margin-top:8px}
.log{background:#0a0c14;border-top:1px solid #1e2130;padding:9px 16px;font-family:ui-monospace,monospace;font-size:11px;color:#7b8398}
</style></head><body>
<div id="gate" class="gate"><div style="font-size:16px;color:#fff;font-weight:500">접속 코드</div>
<div style="font-size:12px;color:#727a92;margin-top:4px">담당자에게 받은 코드를 입력하세요.</div>
<input type="password" id="c" placeholder="접속 코드">
<button onclick="go()" style="width:100%">들어가기</button><div id="ge" class="err"></div></div>
<div id="app" style="display:none"></div>
<script>
var API="https://script.google.com/macros/s/AKfycbwqwXXyB4aB9YC5NWoip1cPxAi76vGaNE7Dnjv0wGXne-WmTHU/exec";var CODE="";var S=null;
function q(p){return fetch(API+"?"+p+"&code="+encodeURIComponent(CODE)).then(function(r){return r.json()})}
function go(){var v=document.getElementById("c").value;if(!v)return;CODE=v;
  q("path=state").then(function(j){if(!j.ok){document.getElementById("ge").textContent=j.error||"코드가 맞지 않습니다.";return}
  try{localStorage.setItem("wv",v)}catch(e){}document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="";render(j)}).catch(function(e){document.getElementById("ge").textContent=String(e)})}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function bcol(s){if(s=="발행완료"||s=="수동게시완료")return "background:#0f3d29;color:#3ddc97";
  if(s=="게시대기(수동)")return "background:#3d3113;color:#f5a623";
  if(s=="오류"||s=="금지어차단")return "background:#3d1a1a;color:#ff7b72";return "background:#1b1f2f;color:#9aa2b8"}
function render(j){S=j;var d=j.data,a=j.auto||{};var H=[];
H.push("<div class=\"top\"><div class=\"lg\">W</div><span style=\"font-size:13px;font-weight:500\">We Vape SNS 자동발행</span>");
H.push("<span class=\"pill\"><span class=\"dot\""+(a.on?"":" style=background:#f5a623")+"></span> "+(a.fullAuto?"풀 오토 실행 중":(a.on?"자동 발행만 켜짐":"자동 실행 꺼짐"))+"</span>");
H.push("<span class=\"pill\">"+(d.linked?"쓰레드↔인스타 연동":"채널별 개별 발행")+"</span></div>");
H.push("<div class=\"wrap\"><div class=\"side\"><div class=\"sl\">지점</div>");
var cnt={};(d.rows||[]).forEach(function(r){cnt[r.store]=(cnt[r.store]||0)+1});
(d.stores||[]).forEach(function(s){H.push("<div class=\"si\" onclick=\"pick(this,'"+s+"')\">"+esc(s)+" <b>"+(cnt[s]||0)+"</b></div>")});
H.push("</div><div class=\"main\"><div class=\"eb\">SNS AUTOMATION</div>");
H.push("<h1>오늘도 <span style=color:#6c5ce7>자동으로</span> 돌아갑니다</h1>");
H.push("<div class=\"sub\">생성 · 검사 · 발행까지 사람 손 없이</div>");
var qd=a.queueDays||0,tk=a.tokenDaysLeft;
H.push("<div class=\"g\">");
H.push(card("예약 큐",qd,"일치",Math.min(100,qd/28*100),"#3ddc97"));
H.push(card("토큰 잔여",tk==null?"—":tk,"일",tk==null?0:tk/60*100,"#4a8cf7"));
H.push(card("등록 게시물",(d.rows||[]).length,"건",60,"#6c5ce7"));
H.push(card("지점",d.storeCount||0,"곳",100,"#f5a623"));
H.push("</div><div id=\"list\"></div></div></div>");
document.getElementById("app").innerHTML=H.join("");list("전체")}
function card(t,v,u,p,c){return "<div class=\"cd\"><div class=\"t\">"+t+"</div><div class=\"v\">"+v+"<small>"+u+"</small></div><div class=\"bar\"><div class=\"fl\" style=\"width:"+p+"%;background:"+c+"\"></div></div></div>"}
function pick(el,s){var n=el.parentNode.querySelectorAll(".si");for(var i=0;i<n.length;i++)n[i].classList.remove("on");el.classList.add("on");list(s)}
function list(store){var rows=(S.data.rows||[]).filter(function(r){return store=="전체"||r.store==store});
var H=[];if(!rows.length)H.push("<div style=color:#5d6478;font-size:13px>등록된 게시물이 없습니다.</div>");
rows.forEach(function(r){H.push("<div class=\"row\"><div class=\"rh\"><div><span class=\"dt\">"+esc(r.date)+"</span> <span class=\"chip\">"+esc(r.store)+"</span><span class=\"chip\">"+esc(r.channel)+"</span></div>");
H.push("<span class=\"bdg\" style=\""+bcol(r.status)+"\">"+esc(r.status)+"</span></div>");
if(r.text)H.push("<div class=\"tx\">"+esc(r.text)+"</div>");H.push("</div>")});
document.getElementById("list").innerHTML=H.join("")}
var sv=null;try{sv=localStorage.getItem("wv")}catch(e){}
if(sv){document.getElementById("c").value=sv;go()}
</script></body></html>
